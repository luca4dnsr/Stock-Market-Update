name: 📈 SPX Daily Update

on:
  schedule:
    # 미국 동부 시간 오후 4시 마감 기준
    # 여름(EDT): 20:00 UTC / 겨울(EST): 21:00 UTC
    # → 22:00 UTC (= 다음날 07:00 KST) 실행으로 DST 관계없이 안전
    - cron: '0 22 * * 1-5'   # 월~금 UTC 22:00 (KST 다음날 07:00)

  # 수동 트리거 (GitHub Actions 탭에서 직접 실행 가능)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (데이터 수집만, 파일 출력 없음)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      nim_probe:
        description: 'NVIDIA NIM GPT-OSS 최소 응답 진단 (파일 생성·이메일 발송 없음)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write   # output/ 및 docs/ 커밋·푸시를 위해 필요

concurrency:
  group: spx-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate SPX Daily Report
    runs-on: ubuntu-latest
    env:
      MARKET_RAG_DB_PATH: cache/market_rag.sqlite3

    steps:
      # ── 1. 코드 체크아웃 ──────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python 설정 ────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      # 캐시는 7일 유효한 구성종목 CSV를 다음 실행에 복원한다.
      # 매 실행마다 고유 키를 저장하고, 최신 캐시를 prefix로 복원한다.
      - name: Restore non-RAG runtime caches
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: |
            cache/sp500_components.csv
            cache/business_profiles.json
            cache/ai_daily_insights.json
            cache/finnhub_market_news.json
          key: spx-components-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            spx-components-${{ runner.os }}-

      - name: Restore market RAG database
        id: restore_rag_cache
        if: github.event.inputs.nim_probe != 'true'
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ env.MARKET_RAG_DB_PATH }}
          key: market-rag-schema-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-report
          restore-keys: |
            market-rag-schema-v1-${{ runner.os }}-

      - name: Inspect restored market RAG cache
        id: restored_rag_state
        if: github.event.inputs.nim_probe != 'true'
        shell: bash
        run: |
          if [ -s "$MARKET_RAG_DB_PATH" ]; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
            echo "Restored market RAG DB: $MARKET_RAG_DB_PATH ($(stat -c%s "$MARKET_RAG_DB_PATH") bytes)"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "No prior market RAG DB was restored; ingestion will initialize it."
          fi

      # ── 3. 의존성 설치 ────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python sources
        run: |
          python -m py_compile *.py
          python -m unittest discover -s tests -v

      - name: Log runtime provenance
        run: |
          echo "Git SHA: $(git rev-parse HEAD)"
          python --version
          python - <<'PYEOF'
          import pandas
          import yfinance

          print(f"pandas: {pandas.__version__}")
          print(f"yfinance: {yfinance.__version__}")
          PYEOF

      - name: Ingest Finnhub market news for RAG
        id: rag_ingest
        if: github.event.inputs.nim_probe != 'true'
        continue-on-error: true
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        shell: bash
        run: |
          RESULT_FILE="$RUNNER_TEMP/market-rag-ingest.json"
          set +e
          python -m market_rag ingest --db "$MARKET_RAG_DB_PATH" > "$RESULT_FILE"
          COMMAND_STATUS=$?
          set -e
          cat "$RESULT_FILE"

          RAG_RESULT_FILE="$RESULT_FILE" RAG_COMMAND_STATUS="$COMMAND_STATUS" python - <<'PYEOF'
          import json
          import os

          try:
              with open(os.environ["RAG_RESULT_FILE"], encoding="utf-8") as source:
                  payload = json.load(source)
          except (OSError, json.JSONDecodeError) as exc:
              payload = {
                  "ok": False,
                  "error_code": f"invalid_result:{type(exc).__name__}",
              }

          command_status = int(os.environ["RAG_COMMAND_STATUS"])
          status = "ok" if command_status == 0 and payload.get("ok") is True else "degraded"
          error_code = str(payload.get("error_code") or "none")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"status={status}\n")
              output.write(f"error_code={error_code}\n")
              for field in ("fetched", "inserted", "updated", "deduplicated", "pruned", "article_count"):
                  output.write(f"{field}={payload.get(field, 'unknown')}\n")
          if status != "ok":
              raise SystemExit(1)
          PYEOF

          exit "$COMMAND_STATUS"

      - name: Check market RAG database
        id: rag_db_check
        if: always() && github.event.inputs.nim_probe != 'true'
        continue-on-error: true
        shell: bash
        run: |
          RESULT_FILE="$RUNNER_TEMP/market-rag-quick-check.json"
          set +e
          python -m market_rag quick-check --db "$MARKET_RAG_DB_PATH" > "$RESULT_FILE"
          COMMAND_STATUS=$?
          set -e
          cat "$RESULT_FILE"

          RAG_RESULT_FILE="$RESULT_FILE" RAG_COMMAND_STATUS="$COMMAND_STATUS" python - <<'PYEOF'
          import json
          import os

          try:
              with open(os.environ["RAG_RESULT_FILE"], encoding="utf-8") as source:
                  payload = json.load(source)
          except (OSError, json.JSONDecodeError) as exc:
              payload = {
                  "ok": False,
                  "result": f"invalid_result:{type(exc).__name__}",
              }

          command_status = int(os.environ["RAG_COMMAND_STATUS"])
          quick_check = str(payload.get("result") or "not_run")
          status = (
              "ok"
              if command_status == 0
              and payload.get("ok") is True
              and quick_check.lower() == "ok"
              else "degraded"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"status={status}\n")
              output.write(f"quick_check={quick_check}\n")
              output.write(f"article_count={payload.get('article_count', 'unknown')}\n")
          if status != "ok":
              raise SystemExit(1)
          PYEOF

      - name: Save ingested market RAG database
        id: save_rag_ingest_cache
        if: >-
          always() &&
          github.event.inputs.nim_probe != 'true' &&
          steps.rag_db_check.outputs.status == 'ok'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ env.MARKET_RAG_DB_PATH }}
          key: market-rag-schema-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-ingest

      # ── 4. NVIDIA NIM 최소 응답 진단 (수동 실행 전용) ─────
      - name: Probe NVIDIA NIM
        if: github.event.inputs.nim_probe == 'true'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python - <<'PYEOF'
          import os
          import sys
          import time

          import requests

          api_key = os.getenv("NVIDIA_API_KEY")
          if not api_key:
              raise RuntimeError("NVIDIA_API_KEY가 설정되지 않았습니다.")

          endpoint = "https://integrate.api.nvidia.com/v1/chat/completions"
          models = [("GPT-OSS 120B", "openai/gpt-oss-120b")]
          failures = 0
          for label, model in models:
              started = time.monotonic()
              try:
                  response = requests.post(
                      endpoint,
                      headers={"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"},
                      json={
                          "model": model,
                          "messages": [
                              {"role": "system", "content": "Return only JSON."},
                              {"role": "user", "content": '{"ok":true}'},
                          ],
                          "temperature": 0,
                          "max_tokens": 32,
                          "stream": False,
                      },
                      timeout=(10, 180),
                  )
                  elapsed = time.monotonic() - started
                  print(f"NIM probe | {label} | HTTP {response.status_code} | {elapsed:.1f}s")
                  if not response.ok:
                      print(response.text[:500])
                      failures += 1
              except requests.RequestException as exc:
                  elapsed = time.monotonic() - started
                  print(f"NIM probe | {label} | request error after {elapsed:.1f}s | {exc}")
                  failures += 1
          sys.exit(1 if failures else 0)
          PYEOF

      # ── 5. SPX 업데이트 실행 ─────────────────────────────
      - name: Run SPX update
        id: run_spx
        if: github.event.inputs.nim_probe != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          RUN_MARKER="$RUNNER_TEMP/spx-run-start"
          touch "$RUN_MARKER"
          echo "report_generated=false" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run --verbose
          else
            python main.py
            LATEST=$(find output -maxdepth 1 -type f -name 'SPX_daily_*.html' -newer "$RUN_MARKER" -print | sort | tail -1)
            if [ -z "$LATEST" ] || [ ! -s output/summary.json ] || [ ! output/summary.json -nt "$RUN_MARKER" ]; then
              echo "Current run did not produce a fresh dashboard and summary.json." >&2
              exit 1
            fi
            echo "report_generated=true" >> "$GITHUB_OUTPUT"
            echo "html_path=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Check market RAG database after report
        id: rag_db_post_check
        if: >-
          steps.run_spx.outcome == 'success' &&
          steps.run_spx.outputs.report_generated == 'true'
        continue-on-error: true
        run: python -m market_rag quick-check --db "$MARKET_RAG_DB_PATH"

      - name: Save report-updated market RAG database
        id: save_rag_cache
        if: >-
          steps.rag_db_post_check.outcome == 'success'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ env.MARKET_RAG_DB_PATH }}
          key: market-rag-schema-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-report

      # ── 5. GitHub Pages용 HTML 복사 ─────────────────────
      - name: Prepare GitHub Pages (docs/)
        id: prepare_pages
        if: >-
          steps.run_spx.outcome == 'success' &&
          steps.run_spx.outputs.report_generated == 'true' &&
          github.event.inputs.dry_run != 'true' &&
          github.event.inputs.nim_probe != 'true'
        run: |
          mkdir -p docs
          cp "${{ steps.run_spx.outputs.html_path }}" docs/index.html
          echo "GitHub Pages: ${{ steps.run_spx.outputs.html_path }} -> docs/index.html"

      # ── 6. 최신 웹 대시보드를 Actions Artifact로 업로드 ───
      - name: Upload dashboard as artifact
        if: >-
          steps.run_spx.outputs.report_generated == 'true' &&
          steps.prepare_pages.outcome == 'success' &&
          github.event.inputs.dry_run != 'true' &&
          github.event.inputs.nim_probe != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: spx-dashboard-${{ github.run_number }}
          path: |
            output/summary.json
            docs/index.html
          retention-days: 30    # 30일 보관 후 자동 삭제

      # ── 7. output/ + docs/ 를 저장소에 커밋 ──────────────
      - name: Commit and push output
        if: >-
          steps.run_spx.outputs.report_generated == 'true' &&
          steps.prepare_pages.outcome == 'success' &&
          github.event.inputs.dry_run != 'true' &&
          github.event.inputs.nim_probe != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # output/ 및 docs/는 로컬 산출물을 무시하도록 .gitignore에 있으므로
          # Actions가 생성한 검증 완료 산출물만 의도적으로 강제 스테이징한다.
          git add -f output/ docs/
          # 변경 사항이 있을 때만 커밋
          if git diff --staged --quiet; then
            echo "변경 사항 없음 — 커밋 생략"
          else
            DATE=$(date -u +'%Y-%m-%d')
            git commit -m "📈 SPX Daily Update ${DATE} [auto]"
            git push
            echo "커밋 및 푸시 완료"
          fi

      # ── 8. 이메일 본문(HTML) 생성 ────────────────────────
      - name: Generate email body
        if: >-
          steps.run_spx.outputs.report_generated == 'true' &&
          steps.prepare_pages.outcome == 'success' &&
          github.event.inputs.dry_run != 'true' &&
          github.event.inputs.nim_probe != 'true'
        run: |
          python3 - << 'PYEOF'
          import json, pathlib

          s = json.loads(pathlib.Path("output/summary.json").read_text())

          def row(r):
              color = "#cc0000" if r["return_1d"] > 0 else "#0055cc"
              sign  = f"+{r['return_1d']:.1f}" if r["return_1d"] > 0 else f"{r['return_1d']:.1f}"
              return (
                  f"<tr>"
                  f"<td style='padding:8px 12px;font-weight:700'>{r['ticker']}</td>"
                  f"<td style='padding:8px 12px;color:#555'>{r['name'][:32]}</td>"
                  f"<td style='padding:8px 12px;text-align:right;font-weight:700;color:{color}'>{sign}%</td>"
                  f"</tr>"
              )

          top_rows = "".join(row(r) for r in s["top3"])
          bot_rows = "".join(row(r) for r in s["bot3"])
          adv_pct  = round(s["advances"] / max(s["advances"] + s["declines"], 1) * 100)

          html = f"""
          <!DOCTYPE html><html><body style="margin:0;padding:20px;background:#f0f4f8;font-family:'Helvetica Neue',Arial,sans-serif">
          <div style="max-width:580px;margin:0 auto">

            <!-- 헤더 -->
            <div style="background:linear-gradient(135deg,#111827,#1e3a5f);padding:28px 32px;border-radius:12px 12px 0 0">
              <h1 style="margin:0;color:white;font-size:22px;font-weight:800">📈 SPX Daily Monitor</h1>
              <p style="margin:6px 0 0;color:#94a3b8;font-size:13px">데이터 기준일: {s['data_date']}</p>
            </div>

            <!-- 시장 폭 -->
            <div style="background:white;padding:24px 32px">
              <table style="width:100%;border-collapse:separate;border-spacing:12px"><tr>
                <td style="background:#fff5f5;border:1.5px solid #fca5a5;border-radius:10px;padding:16px;text-align:center">
                  <div style="font-size:30px;font-weight:900;color:#cc0000">↑ {s['advances']}</div>
                  <div style="color:#888;font-size:12px;margin-top:4px">상승 종목</div>
                </td>
                <td style="background:#eff6ff;border:1.5px solid #93c5fd;border-radius:10px;padding:16px;text-align:center">
                  <div style="font-size:30px;font-weight:900;color:#0055cc">↓ {s['declines']}</div>
                  <div style="color:#888;font-size:12px;margin-top:4px">하락 종목</div>
                </td>
                <td style="background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:10px;padding:16px;text-align:center">
                  <div style="font-size:30px;font-weight:900;color:#374151">{adv_pct}%</div>
                  <div style="color:#888;font-size:12px;margin-top:4px">상승 비율</div>
                </td>
              </tr></table>
            </div>

            <!-- 상위 TOP 3 -->
            <div style="background:white;padding:0 32px 20px">
              <h2 style="font-size:15px;margin:0 0 10px;color:#111">🚀 상위 TOP 3</h2>
              <table style="width:100%;border-collapse:collapse;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden">
                <thead><tr style="background:#f9fafb">
                  <th style="padding:8px 12px;text-align:left;font-size:11px;color:#6b7280">티커</th>
                  <th style="padding:8px 12px;text-align:left;font-size:11px;color:#6b7280">종목명</th>
                  <th style="padding:8px 12px;text-align:right;font-size:11px;color:#6b7280">1일 수익률</th>
                </tr></thead>
                <tbody>{top_rows}</tbody>
              </table>
            </div>

            <!-- 하위 BOTTOM 3 -->
            <div style="background:white;padding:0 32px 24px">
              <h2 style="font-size:15px;margin:0 0 10px;color:#111">📉 하위 BOTTOM 3</h2>
              <table style="width:100%;border-collapse:collapse;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden">
                <thead><tr style="background:#f9fafb">
                  <th style="padding:8px 12px;text-align:left;font-size:11px;color:#6b7280">티커</th>
                  <th style="padding:8px 12px;text-align:left;font-size:11px;color:#6b7280">종목명</th>
                  <th style="padding:8px 12px;text-align:right;font-size:11px;color:#6b7280">1일 수익률</th>
                </tr></thead>
                <tbody>{bot_rows}</tbody>
              </table>
            </div>

            <!-- 푸터 -->
            <div style="background:#f9fafb;padding:16px 32px;border-radius:0 0 12px 12px;border-top:1px solid #e5e7eb">
              <p style="margin:0;font-size:12px;color:#9ca3af">
                🌐 최신 전체 결과는 웹 대시보드에서 확인하세요.<br>
                자동 생성: SPX Daily Monitor (GitHub Actions)
              </p>
            </div>

          </div></body></html>
          """

          pathlib.Path("output/email_body.html").write_text(html.strip(), encoding="utf-8")
          print("이메일 본문 생성 완료")
          PYEOF

      - name: Set report date for email
        if: >-
          steps.run_spx.outputs.report_generated == 'true' &&
          steps.prepare_pages.outcome == 'success' &&
          github.event.inputs.dry_run != 'true' &&
          github.event.inputs.nim_probe != 'true'
        run: |
          REPORT_DATE=$(python3 -c "import json; print(json.load(open('output/summary.json'))['data_date'])")
          echo "REPORT_DATE=${REPORT_DATE}" >> "$GITHUB_ENV"

      # ── 9. 이메일 발송 ────────────────────────────────────
      # 사전 설정 필요: GitHub Secrets에 EMAIL_USERNAME, EMAIL_PASSWORD, EMAIL_TO 등록
      # 설정 안 되어 있으면 이 스텝은 조용히 건너뜀 (continue-on-error: true)
      - name: Send email report
        if: >-
          steps.run_spx.outputs.report_generated == 'true' &&
          steps.prepare_pages.outcome == 'success' &&
          github.event.inputs.dry_run != 'true' &&
          github.event.inputs.nim_probe != 'true'
        continue-on-error: true   # 이메일 미설정 시에도 워크플로우 실패 X
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.naver.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "📈 SPX Daily Update ${{ env.REPORT_DATE }}"
          html_body: file://output/email_body.html
          to: ${{ secrets.EMAIL_TO }}
          from: "SPX Daily Monitor <${{ secrets.EMAIL_USERNAME }}>"

      # ── 10. 실행 요약 ─────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          RAG_INGEST_OUTCOME="${{ steps.rag_ingest.outcome }}"
          RAG_INGEST_STATUS="${{ steps.rag_ingest.outputs.status }}"
          RAG_INGEST_ERROR="${{ steps.rag_ingest.outputs.error_code }}"
          RAG_FETCHED="${{ steps.rag_ingest.outputs.fetched }}"
          RAG_INSERTED="${{ steps.rag_ingest.outputs.inserted }}"
          RAG_DB_STATUS="${{ steps.rag_db_check.outputs.status }}"
          RAG_QUICK_CHECK="${{ steps.rag_db_check.outputs.quick_check }}"
          RAG_ARTICLES="${{ steps.rag_db_check.outputs.article_count }}"
          RAG_INGEST_CACHE_SAVE="${{ steps.save_rag_ingest_cache.outcome }}"
          RAG_POST_CHECK="${{ steps.rag_db_post_check.outcome }}"
          RAG_REPORT_CACHE_SAVE="${{ steps.save_rag_cache.outcome }}"
          REPORT_OUTCOME="${{ steps.run_spx.outcome }}"
          REPORT_GENERATED="${{ steps.run_spx.outputs.report_generated }}"
          PAGES_OUTCOME="${{ steps.prepare_pages.outcome }}"

          [ -n "$RAG_INGEST_OUTCOME" ] || RAG_INGEST_OUTCOME="skipped"
          [ -n "$RAG_INGEST_STATUS" ] || RAG_INGEST_STATUS="not_run"
          [ -n "$RAG_INGEST_ERROR" ] || RAG_INGEST_ERROR="none"
          [ -n "$RAG_FETCHED" ] || RAG_FETCHED="unknown"
          [ -n "$RAG_INSERTED" ] || RAG_INSERTED="unknown"
          [ -n "$RAG_DB_STATUS" ] || RAG_DB_STATUS="not_checked"
          [ -n "$RAG_QUICK_CHECK" ] || RAG_QUICK_CHECK="not_run"
          [ -n "$RAG_ARTICLES" ] || RAG_ARTICLES="unknown"
          [ -n "$RAG_INGEST_CACHE_SAVE" ] || RAG_INGEST_CACHE_SAVE="skipped"
          [ -n "$RAG_POST_CHECK" ] || RAG_POST_CHECK="skipped"
          [ -n "$RAG_REPORT_CACHE_SAVE" ] || RAG_REPORT_CACHE_SAVE="skipped"
          [ -n "$REPORT_OUTCOME" ] || REPORT_OUTCOME="skipped"
          [ -n "$REPORT_GENERATED" ] || REPORT_GENERATED="false"
          [ -n "$PAGES_OUTCOME" ] || PAGES_OUTCOME="skipped"

          echo "### 📈 SPX Daily Automation Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| UTC time | $(date -u +'%Y-%m-%d %H:%M') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run | #${{ github.run_number }} attempt ${{ github.run_attempt }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Git SHA | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry run | ${{ github.event.inputs.dry_run || 'false' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| NIM probe | ${{ github.event.inputs.nim_probe || 'false' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| RAG cache restored | ${{ steps.restored_rag_state.outputs.restored || 'false' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| RAG ingest | $RAG_INGEST_STATUS ($RAG_INGEST_OUTCOME, error=$RAG_INGEST_ERROR) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| RAG fetched / inserted | $RAG_FETCHED / $RAG_INSERTED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| RAG DB quick_check | $RAG_DB_STATUS ($RAG_QUICK_CHECK) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| RAG article count | $RAG_ARTICLES |" >> "$GITHUB_STEP_SUMMARY"
          echo "| RAG ingest cache save | $RAG_INGEST_CACHE_SAVE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| RAG post-report check / save | $RAG_POST_CHECK / $RAG_REPORT_CACHE_SAVE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run SPX step | $REPORT_OUTCOME |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Current-run output | $REPORT_GENERATED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pages preparation | $PAGES_OUTCOME |" >> "$GITHUB_STEP_SUMMARY"
